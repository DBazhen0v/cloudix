{% extends "base.html" %}

{% block content %}
<div class="dashboard">
  <aside class="dashboard-sidebar">
    <nav class="dashboard-nav">
      <a href="{{ url_for('shop.index') }}" class="dashboard-nav-item">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        Главная
      </a>
      <a href="{{ url_for('cabinet.index') }}" class="dashboard-nav-item {% if active_nav == 'overview' %}active{% endif %}">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
        Обзор
      </a>
      <a href="{{ url_for('cabinet.servers') }}" class="dashboard-nav-item {% if active_nav == 'servers' %}active{% endif %}">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><circle cx="7" cy="7.5" r="0.8" fill="currentColor" stroke="none"/><circle cx="7" cy="16.5" r="0.8" fill="currentColor" stroke="none"/></svg>
        Мои сервера
      </a>
      <a href="{{ url_for('cabinet.orders') }}" class="dashboard-nav-item {% if active_nav == 'orders' %}active{% endif %}">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l3 3v17H6Z"/><path d="M9 11h6"/><path d="M9 15h6"/></svg>
        Заказы
      </a>
      <a href="{{ url_for('cabinet.subscriptions') }}" class="dashboard-nav-item {% if active_nav == 'subscriptions' %}active{% endif %}">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14.3-4.9"/><path d="M21 4v5h-5"/><path d="M20 12a8 8 0 0 1-14.3 4.9"/><path d="M3 20v-5h5"/></svg>
        Подписки
      </a>
      <a href="{{ url_for('cabinet.invoices') }}" class="dashboard-nav-item {% if active_nav == 'invoices' %}active{% endif %}">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/><path d="M6 15h4"/></svg>
        Счета
      </a>
      <a href="{{ url_for('cabinet.support_list') }}" class="dashboard-nav-item {% if active_nav == 'support' %}active{% endif %}">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 18 0v5a2 2 0 0 1-2 2h-1v-7h3"/><path d="M3 17v-5h3v7H4a1 1 0 0 1-1-1Z"/></svg>
        Поддержка
      </a>
      <a href="{{ url_for('cabinet.notifications') }}" class="dashboard-nav-item {% if active_nav == 'notifications' %}active{% endif %}">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        Уведомления
        {% if unread_notifications %}<span class="dashboard-nav-count">{{ unread_notifications }}</span>{% endif %}
      </a>
      <a href="{{ url_for('cabinet.profile') }}" class="dashboard-nav-item {% if active_nav == 'profile' %}active{% endif %}">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        Профиль
      </a>
    </nav>
  </aside>

  <div class="dashboard-main">
    <h1 class="dashboard-title">{% block dashboard_title %}{% endblock %}</h1>
    {% block dashboard_content %}{% endblock %}
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var btn = document.getElementById('dashboard-support-btn');
    var toggle = document.getElementById('support-toggle');
    if (btn && toggle) { btn.addEventListener('click', function () { toggle.click(); }); }
  });
</script>
{% endblock %}
